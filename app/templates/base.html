<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ACEest Fitness{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="top"><a class="brand" href="{{ url_for('dashboard.index') }}">ACEest <span>FITNESS & PERFORMANCE</span></a>
<nav><a href="{{ url_for('dashboard.index') }}">Dashboard</a><a href="{{ url_for('clients.index') }}">Clients</a><a href="{{ url_for('clients.add') }}">Add client</a></nav></header>
<main class="wrap">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main><footer>ACEest Fitness & Performance · Flask starter</footer></body></html>
