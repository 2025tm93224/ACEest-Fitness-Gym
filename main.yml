name: ACEest Fitness CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: aceest-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall -q app run.py config.py tests

      - name: Lint Python source with Flake8
        run: python -m flake8 app run.py config.py tests --count --show-source --statistics --max-line-length=100 --extend-ignore=E203,W503

  docker-build:
    name: Assemble Docker images
    runs-on: ubuntu-latest
    needs: build-lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          tags: aceest-fitness:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: test
          tags: aceest-fitness:test
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Pytest inside the test container
        run: docker run --rm aceest-fitness:test
